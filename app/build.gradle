plugins {
    id 'com.android.application'
}

android {
    namespace 'ge.carmarket.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ge.carmarket.app'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

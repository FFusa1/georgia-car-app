name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # daily: refresh the customs data of the web version (the APK is not rebuilt)
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using saved signing key"
          else
            echo "No saved signing key: a new one is created for this build"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeorgiaCarMarket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeorgiaCarMarket-apk
          path: GeorgiaCarMarket.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GeorgiaCarMarket.apk \
            --title "Georgia Car Market (latest build)" \
            --notes "Download GeorgiaCarMarket.apk on your Android phone and open it to install. Built from commit ${GITHUB_SHA::7}."

  web:
    # Publishes the same app as a home-screen web app (iPhone: Safari > Share > Add to Home Screen)
    # on the gh-pages branch, served by GitHub Pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null
          mkdir _site
          cp app/src/main/assets/* _site/
          cp web/manifest.webmanifest web/sw.js _site/
          for s in 180 192 512; do rsvg-convert -w $s -h $s web/icon.svg -o _site/icon-$s.png; done
          sed -i "s/gcm-shell-v1/gcm-shell-${GITHUB_SHA::7}/" _site/sw.js
          touch _site/.nojekyll

      - name: Download customs data for the web version
        # Web pages cannot call UN Comtrade or the NBG policy-rate page, so the data is fetched here.
        # Anything that fails to download is kept from the previous snapshot.
        timeout-minutes: 60
        run: |
          curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/snapshot.json" -o old.json || echo '{}' > old.json
          python3 web/snapshot.py old.json _site/snapshot.json

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="Georgia Car Market" -c user.email="noreply@example.com" commit -q -m "Web app from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

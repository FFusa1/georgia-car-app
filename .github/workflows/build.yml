name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using saved signing key"
          else
            echo "No saved signing key: a new one is created for this build"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeorgiaCarMarket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeorgiaCarMarket-apk
          path: GeorgiaCarMarket.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GeorgiaCarMarket.apk \
            --title "Georgia Car Market (latest build)" \
            --notes "Download GeorgiaCarMarket.apk on your Android phone and open it to install. Built from commit ${GITHUB_SHA::7}."
